# Local Postgres and Redis for later phases.
# This file does not start by itself. Docker was not available on the
# Phase 0 machine, and no application connects to these services yet.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: leados
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: ngreen_leados
    ports:
      - "5432:5432"
    volumes:
      - leados_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  leados_pg:
