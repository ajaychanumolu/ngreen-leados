[project]
name = "ngreen-leados"
version = "0.0.0"
description = "N Green LeadOS Phase 0 contracts and reference-data checks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.14.3",
    "fastapi==0.163.1",
    "uvicorn==0.38.0",
    "sqlalchemy==2.1.9",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "PyJWT==2.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages/contracts/src"]

[tool.setuptools.package-dir]
"" = "packages/contracts/src"

[tool.pytest.ini_options]
testpaths = ["tests", "services/api/tests"]
pythonpath = ["packages/contracts/src", "services/api"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/contracts/src", "services/api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
